; Creality K2 Plus 列印監控 — Waveshare ESP32-S3-Touch-AMOLED-1.75（466x466 圓形 AMOLED）
; 使用 pioarduino 平台（Arduino-ESP32 3.x），Waveshare 官方範例也是 3.x 核心
[env:amoled175]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = default_16MB.csv
board_build.flash_mode = qio
; 16MB QIO Flash + 8MB OPI PSRAM（ESP32-S3R8）
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    tzapu/WiFiManager@^2.0.17
    bblanchon/ArduinoJson@^7.2.1
    bodmer/TFT_eSPI@^2.5.43
    moononournation/GFX Library for Arduino@^1.6.0
    lewisxhe/SensorLib@^0.3.1
    bitbank2/JPEGDEC@^1.8.0

; TFT_eSPI 在這裡「只當離屏畫布 + 字型」用，不會初始化任何硬體，所以腳位都設 -1。
; 真正的螢幕由 src/panel.cpp 的 Arduino_GFX（CO5300）負責。
build_flags =
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    -D TFT_CS=-1
    -D TFT_DC=-1
    -D TFT_RST=-1
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT8=1
    ; 若想用你 fork 裡的中文配網字串，加上下面這行並放入 wm_strings_zh.h
    ; -D WM_STRINGS_FILE='"wm_strings_zh.h"'
