name: Build firmware

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO and esptool
        run: pip install platformio esptool

      - name: Build
        run: pio run

      # ESP32-S3 需要 bootloader / 分割表 / boot_app0 / 韌體四個檔案；
      # 合併成單一檔案，網頁燒錄時整包寫到 0x0 即可
      - name: Merge into a single image
        run: |
          B=.pio/build/amoled175
          BOOT_APP0=$(find ~/.platformio -name boot_app0.bin | head -n 1)
          python -m esptool --chip esp32s3 merge_bin -o $B/firmware-merged.bin \
            0x0 $B/bootloader.bin \
            0x8000 $B/partitions.bin \
            0xe000 "$BOOT_APP0" \
            0x10000 $B/firmware.bin

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            .pio/build/amoled175/firmware-merged.bin
            .pio/build/amoled175/firmware.bin
